name: Julia Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --startup-file=no --threads=4 --project=. test/runtests.jl
      - run: python test/integration/tui_pty.py
        env:
          SHENSCOPE_JULIA: julia
          JULIA_DEPOT_PATH: /home/runner/.julia
      - run: git diff --check
  project-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: python scripts/setup_backends.py
        env:
          SHENSCOPE_TOOLS_DIR: ${{ runner.temp }}/shenscope-tools
          SHENSCOPE_REFERENCES: ${{ runner.temp }}/shenscope-references
          SHENSCOPE_PARSER_CACHE: ${{ runner.temp }}/shenscope-parser-cache
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --startup-file=no --threads=4 --project=. test/project_data.jl
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors
      - run: python scripts/setup_semantic.py --verify
      - run: julia --startup-file=no --threads=4 --project=. test/project_watch_integration.jl
      - run: julia --startup-file=no --threads=4 --project=. test/project_watch_protocol.jl
      - run: julia --startup-file=no --threads=4 --project=. test/project_watch.jl
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors
      - run: python scripts/setup_semantic.py --verify
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --startup-file=no --threads=4 --project=. test/semantic.jl
      - run: npm run check && npm run build && npm test
        working-directory: editors
        env:
          SHENSCOPE_JULIA: julia
          JULIA_DEPOT_PATH: /home/runner/.julia
