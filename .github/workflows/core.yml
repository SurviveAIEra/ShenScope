name: Julia Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --startup-file=no --threads=4 --project=. test/runtests.jl
      - run: python test/integration/tui_pty.py
        env:
          SHENSCOPE_JULIA: julia
          JULIA_DEPOT_PATH: /home/runner/.julia
      - run: git diff --check
